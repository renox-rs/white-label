# The demo client of F5 (05 Clinics): a private outpatient clinic with two
# branches. Data is fictional. Boot it with
# CLIENT_CONFIG=clients/demo-clinics/client.toml.

[client]
name    = "Palm Grove Clinic LLC"
app     = "clinics"
domain  = "demo.palmgroveclinic.example"
locales = ["en", "ar"]

[branding]
accent       = "#0E7490"
second       = "#B45309"
display_font = "Poppins"

[modules]
enabled = ["parties", "documents", "notify", "invoicing", "ticketing", "payments", "hr", "scheduling", "portal"]

[roles]
# `PLT.RUL.04`: a compliance-critical rule that fails alerts the owner role
# (the owner / medical director) and the company admin (05 §7.2).
owner = "owner"

[[legal_entities]]
code      = "PGC"
name_en   = "Palm Grove Clinic LLC"
emirate   = "dubai"
licensing_authority = "Dubai Health Authority"
trade_licence_no = "8765432"
trn       = "100000000000003"
address_en = "Clinic 3, Jumeirah, Dubai"
default   = true
