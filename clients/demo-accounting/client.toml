# The demo client of F4 (04 Accounting): an accounting firm and fractional CFO
# services provider. Data is fictional. Boot it with
# CLIENT_CONFIG=clients/demo-accounting/client.toml. F4 has no demo command
# (there is no `accounting:demo`); `attendance` is not enabled, so there is no
# unbilled time (WIP) in this demo.

[client]
name    = "Falcon Ledger Accountants LLC"
app     = "accounting"
domain  = "demo.falconledger.example"
locales = ["en", "ar"]

[branding]
accent       = "#1D4ED8"
second       = "#B45309"
display_font = "Poppins"

[modules]
enabled = ["parties", "documents", "notify", "invoicing", "ticketing", "payments", "sales", "hr", "portal"]

[roles]
# `PLT.RUL.04`: a compliance-critical rule that fails alerts the partner role
# (this vertical's owner role) and the company admin (04 §7.2).
owner = "partner"

[[legal_entities]]
code      = "FLA"
name_en   = "Falcon Ledger Accountants LLC"
emirate   = "dubai"
licensing_authority = "Dubai Department of Economy and Tourism"
trade_licence_no = "7654321"
trn       = "100000000000003"
address_en = "Office 902, Business Bay, Dubai"
default   = true

# The UAE public holidays the business-day counts skip, for example the 20
# business days of a voluntary disclosure (`ACC.ACL.04`). Fixed dates are
# listed; the moon-sighted ones follow the official announcement and are
# amended here each year.
[calendar]
holidays = [
  "2026-01-01",
  "2026-03-20", "2026-03-21", "2026-03-22",
  "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29",
  "2026-06-16",
  "2026-08-25",
  "2026-12-02", "2026-12-03",
  "2027-01-01",
]
