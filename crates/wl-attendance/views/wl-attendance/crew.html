{#- wl-attendance: the crew list of a location and day: who is already marked
    elsewhere, and the midday break to keep or remove. Replace it with
    resources/views/wl-attendance/crew.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['title']">
  <rx-stack>
    <rx-page-header :title="tx['title']" :subtitle="location ~ ' · ' ~ date">
      <rx-link-button :href="route('wl_attendance.crew')" :label="tx['change']" icon="calendar-days" variant="secondary"/>
    </rx-page-header>
    <rx-alert kind="info" :message="break_text"/>
    <rx-table :rows="rows" as="row" :key="row.employee" :caption="tx['subtitle']">
      <rx-column :label="tx['employee']">{{ row.name }}</rx-column>
      <rx-column :label="tx['status']"><rx-badge :kind="row.kind" :text="row.status"/></rx-column>
      <rx-column :label="tx['clashes']" hide-narrow>{{ row.clashes | join(", ") }}</rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['empty']" icon="users"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
