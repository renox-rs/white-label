{#- wl-kernel: the integration connections (wl-kernel §4.5), a renox::grid
    (search on the key and module, filter by status) that fills the screen:
    health, last success and queued calls. Replace it with
    resources/views/wl-kernel/integrations.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['title']">
  <rx-page-header :title="tx['title']" :subtitle="tx['subtitle']"/>
  <rx-grid :page="connections">
    <template rx-if="column.key == 'open'"><a href="{{ row.url }}">{{ tx['open'] }}</a></template>
  </rx-grid>
</rx-page>
