{#- wl-parties: the open review tasks of parties on hold, for the decider
    role, a renox::grid (search, filters, export with parties.export). Replace
    it with resources/views/wl-parties/review_tasks.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['review.title']">
  <rx-page-header :title="tx['review.title']" :subtitle="tx['review.subtitle']"/>
  <rx-grid :page="tasks">
    <template rx-if="column.key == 'task'"><a href="{{ row.url }}">{{ row.header }}</a></template>
  </rx-grid>
</rx-page>
