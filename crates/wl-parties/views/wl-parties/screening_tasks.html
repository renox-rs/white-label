{#- wl-parties: the open possible-match tasks, for the compliance role only
    (parties.block_reason.view), a renox::grid (search on the party and its
    code, export with parties.export). Replace it with
    resources/views/wl-parties/screening_tasks.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['screening.title']">
  <rx-page-header :title="tx['screening.title']" :subtitle="tx['screening.subtitle']"/>
  <rx-grid :page="tasks">
    <template rx-if="column.key == 'due'">{{ row.due }}</template>
  </rx-grid>
</rx-page>
