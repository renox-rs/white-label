{#- wl-parties: the freeze and report tasks of confirmed sanctions matches, for
    the compliance role only (parties.block_reason.view), a renox::grid
    (filters by task and status, export with parties.export). Replace it with
    resources/views/wl-parties/compliance_tasks.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['tasks.title']">
  <rx-page-header :title="tx['tasks.title']" :subtitle="tx['tasks.subtitle']"/>
  <rx-grid :page="tasks">
    <template rx-if="column.key == 'task'"><a href="{{ row.url }}">{{ row.kind }}</a></template>
    <template rx-elif="column.key == 'due'">{{ row.due }}</template>
    <template rx-elif="column.key == 'overdue'"><rx-badge rx-if="row.overdue" kind="error" :text="tx['tasks.overdue']"/></template>
  </rx-grid>
</rx-page>
