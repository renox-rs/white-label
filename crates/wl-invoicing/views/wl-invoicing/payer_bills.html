{#- wl-invoicing: the payer bills (§4 *Payer bill*), a renox::grid (search on
    the number, filters by state, sums of the claimed and
    open amounts) that fills the screen; a row opens the bill. Replace it with
    resources/views/wl-invoicing/payer_bills.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['payer_bill.title']">
  <rx-page-header :title="tx['payer_bill.title']" :subtitle="tx['payer_bill.subtitle']"/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'payer'">{{ row.payer }}</template>
    <template rx-elif="column.key == 'customer'">{{ row.customer }}</template>
    <template rx-elif="column.key == 'source'">{{ row.source }}</template>
  </rx-grid>
</rx-page>
