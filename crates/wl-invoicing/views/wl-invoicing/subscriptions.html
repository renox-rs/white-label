{#- wl-invoicing: the subscriptions (§4 *Subscription*), a renox::grid (search
    on the plan, filters by state and cycle) that fills the screen;
    a row opens the subscription. Replace it with
    resources/views/wl-invoicing/subscriptions.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['subscription.title']">
  <rx-page-header :title="tx['subscription.title']" :subtitle="tx['subscription.subtitle']"/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'party'">{{ row.party }}</template>
  </rx-grid>
</rx-page>
