{#- wl-invoicing: the "New credit note" action on the invoice page, a sheet
    with the net to credit on each line that has credit left and the reason.
    Replace it with resources/views/wl-invoicing/_credit_note_form.html in
    the app. -#}
<rx-action-sheet :id="'credit-note-invoice-' ~ invoice.id" :label="tx['credit_note.new.action']" :action="route('wl_invoicing.invoice_credit_note', invoice.id)"
                 :title="tx['credit_note.new.title']" :description="tx['credit_note.new.description']" :submit-label="tx['credit_note.new.submit']"
                 icon="receipt">
  <rx-input rx-for="line in credit.lines" :name="'net_' ~ line.position" :label="line.description" :hint="tx['credit_note.new.up_to'] ~ ' ' ~ line.remaining"
            :id="'credit-note-line-' ~ line.position"/>
  <rx-textarea name="reason" :label="tx['credit_note.fields.reason']" :id="'credit-note-reason-' ~ invoice.id" required/>
</rx-action-sheet>
