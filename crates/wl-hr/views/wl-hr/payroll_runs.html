{#- wl-hr: the payroll runs, a renox::grid (filters by kind and status, the
    lines and the total net of each run) that fills the screen, and the start
    of a run (`calculate`). Replace it with
    resources/views/wl-hr/payroll_runs.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['payroll.list.title']">
  <rx-page-header :title="tx['payroll.list.title']" :subtitle="tx['payroll.list.subtitle']">
    <template rx-if="can_create">
      <rx-action-sheet id="new-run" :label="tx['payroll.list.new']" :action="route('wl_hr.payroll_create')"
                       :title="tx['payroll.list.new']" :description="tx['payroll.list.new_hint']" :submit-label="tx['payroll.list.new_submit']" icon="plus">
        <rx-input name="period" type="month" :label="tx['payroll.list.period']" id="new-run-period" :value="month" required/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="runs"/>
</rx-page>
