{#- wl-hr: the employees, a renox::grid (search on number, role, title and
    department, filters by status and type) with the progress of the
    onboarding in progress; it fills the screen. Replace it with
    resources/views/wl-hr/employees.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['employees.title']">
  <rx-page-header :title="tx['employees.title']" :subtitle="tx['employees.expiring_only'] if expiring_only else tx['employees.subtitle']">
    <rx-link-button rx-if="expiring_only" href="/hr/employees" :label="tx['employees.show_all']"/>
  </rx-page-header>
  <rx-grid :page="employees">
    <template rx-if="column.key == 'name'">
      <a href="{{ route('wl_hr.employee', row.id) }}">{{ row.name }}</a>
      <div rx-if="row.documents_ending" class="rx-subtitle">{{ tx['employees.documents_ending'] }}: {{ row.documents_ending }}</div>
    </template>
    <template rx-elif="column.key == 'progress'">{{ row.progress }}</template>
  </rx-grid>
</rx-page>
