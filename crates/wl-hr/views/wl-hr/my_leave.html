{#- wl-hr: my leave: ask for leave, cancel it before it starts, what was
    decided and why, and the working days taken this year (badges in the
    header). One renox::grid that fills the screen; the cancel sheets come
    after it. Replace it with resources/views/wl-hr/my_leave.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['my_leave.title']">
  <rx-page-header :title="tx['my_leave.title']" :subtitle="tx['my_leave.subtitle'] if has_employee else tx['my_leave.no_employee']">
    <rx-badge rx-for="row in taken" kind="info" :text="row.kind ~ ' · ' ~ row.days ~ ' (' ~ year ~ ')'"/>
    <template rx-if="has_employee">
      <rx-action-sheet id="request-leave" :label="tx['my_leave.request']" :action="route('wl_hr.leave_request')"
                       :title="tx['my_leave.request']" :description="tx['my_leave.request_description']" :submit-label="tx['my_leave.request']" icon="plus">
        <rx-select name="leave_type" :label="tx['my_leave.type']" :options="types" :selected="'annual'" id="request-leave-type" required/>
        <rx-input name="from_date" type="date" :label="tx['my_leave.from']" :value="today" id="request-leave-from" required/>
        <rx-input name="to_date" type="date" :label="tx['my_leave.to']" :value="today" id="request-leave-to" required/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'period'">{{ row.period }}</template>
    <template rx-elif="column.key == 'days'">{{ row.days }}</template>
    <template rx-elif="column.key == 'note'">{{ row.note }}</template>
    <template rx-elif="column.key == 'actions'">
      <rx-open-button rx-if="row.can_cancel" :id="'cancel-leave-' ~ row.id" :label="tx['my_leave.cancel']" size="small"/>
    </template>
  </rx-grid>
  <rx-action-sheet rx-for="row in cancel_sheets" :button="false" :id="'cancel-leave-' ~ row.id" :label="tx['my_leave.cancel']" :action="route('wl_hr.leave_cancel', row.id)"
                   :title="tx['my_leave.cancel']" :description="tx['my_leave.cancel_description']" :submit-label="tx['my_leave.cancel']" icon="x">
    <rx-textarea name="reason" :label="tx['my_leave.cancel_reason']" :id="'cancel-leave-reason-' ~ row.id"/>
  </rx-action-sheet>
</rx-page>
