{#- wl-hr: the final settlements, a renox::grid (filters by status, sums of
    dues, recoveries, net and paid) that fills the screen, with the legal
    deadline of each. Replace it with resources/views/wl-hr/settlements.html in
    the app. -#}
<rx-page layout="layouts/app.html" :title="tx['settlement.list.title']">
  <rx-page-header :title="tx['settlement.list.title']" :subtitle="tx['settlement.list.subtitle']"/>
  <rx-grid :page="settlements">
    <template rx-if="column.key == 'employee'">{{ row.employee }}</template>
    <template rx-elif="column.key == 'deadline'">
      {{ row.deadline }}
      <rx-badge rx-if="row.overdue" kind="error" :text="tx['settlement.list.overdue']"/>
    </template>
  </rx-grid>
</rx-page>
