[package]
name = "wl-hr"
description = "HR: minimal employee records and onboarding from the templates of a role."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
renox.workspace = true
serde.workspace = true
wl-kernel = { path = "../wl-kernel" }

[dev-dependencies]
tempfile = "3"
# The real payments module in the test that records a payroll line paid another way.
wl-payments = { path = "../wl-payments" }
# The real attendance module in the test that marks a timesheet paid provisionally.
wl-attendance = { path = "../wl-attendance" }
# The real ticketing module in the tests that open the labour case, the
# security task and the HR tasks.
wl-ticketing = { path = "../wl-ticketing" }
