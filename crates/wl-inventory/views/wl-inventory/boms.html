{#- wl-inventory: the bills of materials by item and version, a renox::grid
    (search, sort, filter by status, pages), with a form to
    start one. A version is opened for its components and the actions that
    release and retire it. Replace it with resources/views/wl-inventory/boms.html
    in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['title']">
  <rx-stack>
    <rx-page-header :title="tx['title']" :subtitle="tx['subtitle']" :back="route('wl_inventory.stock')" :back-label="tx['stock']"/>
    <rx-row rx-if="can_manage">
      <rx-action-sheet id="new-bom" :label="tx['new']" :action="route('wl_inventory.bom_make')"
                       :title="tx['new']" :description="tx['new_description']" :submit-label="tx['new_save']" variant="primary" icon="plus">
        <rx-select name="item" :label="tx['item']" :options="items" :selected="''" id="new-bom-item" required/>
        <rx-input name="output" :label="tx['output']" :hint="tx['output_hint']" id="new-bom-output" inputmode="decimal"/>
        <rx-input name="yield_percent" :label="tx['yield']" :hint="tx['yield_hint']" id="new-bom-yield" inputmode="decimal"/>
        <rx-input name="hours" :label="tx['hours']" :hint="tx['hours_hint']" id="new-bom-hours" inputmode="decimal"/>
      </rx-action-sheet>
    </rx-row>
    <rx-link-tabs :items="status_tabs" :current="status_current" :label="tx['filter']"/>
    <rx-grid :page="boms"/>
  </rx-stack>
</rx-page>
