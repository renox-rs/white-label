{#- wl-inventory: the purchase orders waiting for goods, a renox::grid with
    what is still to come on each, and the button that starts a goods receipt
    (or opens the one already started). The Receive sheets follow the grid.
    Replace it with resources/views/wl-inventory/orders.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['orders.title']">
  <rx-page-header :title="tx['orders.title']" :subtitle="tx['orders.subtitle']">
    <rx-link-button route="wl_inventory.receipts" :label="tx['receipts.title']" variant="plain"/>
  </rx-page-header>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'outstanding'">{{ row.outstanding }}</template>
    <template rx-elif="column.key == 'actions'">
      <rx-link-button rx-if="row.draft" :href="row.draft" :label="tx['orders.open_draft']" icon="package"/>
      <rx-open-button rx-elif="row.can_receive" id="receive-{{ row.id }}" label="{{ tx['orders.receive'] }}" size="small"/>
    </template>
  </rx-grid>
  <rx-action-sheet rx-for="sheet in sheets" :button="false" :id="'receive-' ~ sheet.id" :label="tx['orders.receive']" :action="route('wl_inventory.order_receive', sheet.id)"
                   :title="tx['orders.receive']" :description="tx['orders.receive_description']" :submit-label="tx['orders.receive']" icon="package">
    <rx-input name="delivery_note" :label="tx['receipts.delivery_note']" :id="'receive-note-' ~ sheet.id"/>
  </rx-action-sheet>
</rx-page>
