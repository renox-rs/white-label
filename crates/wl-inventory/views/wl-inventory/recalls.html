{#- wl-inventory: the recalls, a renox::grid (search on the number and the
    reason, filters by source and status): where each comes from, why, the
    lots, how far it is (the parties told of those affected). Names nobody.
    Replace it with resources/views/wl-inventory/recalls.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['recalls.title']">
  <rx-page-header :title="tx['recalls.title']" :subtitle="tx['recalls.subtitle']"/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'lots'">{{ row.lots }}</template>
    <template rx-elif="column.key == 'progress'">{{ row.told }} / {{ row.affected }}</template>
  </rx-grid>
</rx-page>
