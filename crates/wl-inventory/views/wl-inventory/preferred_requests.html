{#- wl-inventory: the preferred-supplier requests that wait for a decision, a
    renox::grid, oldest first, with the item (a link to its suppliers) and
    both suppliers. Replace it with
    resources/views/wl-inventory/preferred_requests.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['requests.title']">
  <rx-page-header :title="tx['requests.title']" :subtitle="tx['requests.subtitle']"/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'item'">
      <a href="{{ row.item_url }}">{{ row.item_label }}</a>
    </template>
    <template rx-elif="column.key == 'from'">{{ row.from }}</template>
    <template rx-elif="column.key == 'to'">{{ row.to }}</template>
  </rx-grid>
</rx-page>
