{#- wl-inventory: the transfers between stores, a form for a new one, and the
    buttons that send and receive. A transfer into a store on hold shows the
    warning in its Receive sheet. Replace it with
    resources/views/wl-inventory/transfers.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['transfers.title']">
  <rx-page-header :title="tx['transfers.title']" :subtitle="tx['transfers.subtitle']" :back="route('wl_inventory.stock')" :back-label="tx['stock.title']">
    <template rx-if="can_make">
      <rx-action-sheet id="new-transfer" :label="tx['transfers.new']" :action="route('wl_inventory.transfer_make')"
                       :title="tx['transfers.new']" :description="tx['transfers.new_description']" :submit-label="tx['transfers.new']" icon="plus">
        <rx-select name="from" :label="tx['transfers.from']" :options="from" :selected="''" id="new-transfer-from" required/>
        <rx-select name="to" :label="tx['transfers.to']" :options="to" :selected="''" id="new-transfer-to" required/>
        <rx-select name="item" :label="tx['stock.item']" :options="items" :selected="''" id="new-transfer-item" required/>
        <rx-select name="lot" :label="tx['stock.lot']" :options="lots" :selected="''" id="new-transfer-lot"/>
        <rx-input name="quantity" :label="tx['transfers.quantity']" id="new-transfer-quantity" required/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'lines'">{{ row.lines }}</template>
    <template rx-elif="column.key == 'actions'">
      <rx-open-button rx-if="row.can_send" id="send-{{ row.id }}" label="{{ tx['transfers.send'] }}" size="small"/>
      <rx-open-button rx-if="row.can_receive" id="receive-{{ row.id }}" label="{{ tx['transfers.receive'] }}" size="small"/>
    </template>
  </rx-grid>
  <template rx-for="sheet in sheets">
    <rx-action-sheet rx-if="sheet.can_send" :button="false" :id="'send-' ~ sheet.id" :label="tx['transfers.send']" :action="route('wl_inventory.transfer_send', sheet.id)"
                     :title="tx['transfers.send']" :description="tx['transfers.send_description']" :submit-label="tx['transfers.send']" icon="truck"/>
    <rx-action-sheet rx-if="sheet.can_receive" :button="false" :id="'receive-' ~ sheet.id" :label="tx['transfers.receive']" :action="route('wl_inventory.transfer_receive', sheet.id)"
                     :title="tx['transfers.receive']" :description="sheet.warning or tx['transfers.receive_description']" :submit-label="tx['transfers.receive']" icon="check">
      <input type="hidden" name="held_ok" value="1"/>
    </rx-action-sheet>
  </template>
</rx-page>
