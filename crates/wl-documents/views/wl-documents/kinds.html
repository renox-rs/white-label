{#- wl-documents: the document kinds, a renox::grid (search on key and names,
    filters, export), each kind linking to its page. Replace it with
    resources/views/wl-documents/kinds.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['kinds.title']">
  <rx-page-header :title="tx['kinds.title']" :subtitle="tx['kinds.subtitle']"/>
  <rx-grid :page="kinds">
    <template rx-if="column.key == 'name'">
      <a href="{{ row.url }}">{{ row.title }}</a>
    </template>
    <template rx-elif="column.key == 'subject_types'">{{ row.subject_types }}</template>
  </rx-grid>
</rx-page>
