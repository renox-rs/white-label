{#- wl-scheduling: the bookings, newest start first, a renox::grid (search on
    the number, party, service and resource, filters by service, status and
    start) that fills the screen. Replace it with
    resources/views/wl-scheduling/bookings.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['bookings.title']">
  <rx-page-header :title="tx['bookings.title']" :subtitle="tx['bookings.subtitle']">
    <rx-link-button rx-if="can_manage" route="wl_scheduling.booking_new" :label="tx['bookings.new']" icon="plus"/>
    <rx-link-button route="wl_scheduling.waiting_list" :label="tx['waiting.title']" variant="plain"/>
    <rx-link-button route="wl_scheduling.conflicts" :label="tx['conflicts.title']" variant="plain"/>
  </rx-page-header>
  <rx-grid :page="bookings">
    <template rx-if="column.key == 'party'">{{ row.party }}</template>
    <template rx-elif="column.key == 'resources'">{{ row.resources }}</template>
  </rx-grid>
</rx-page>
