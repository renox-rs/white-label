{#- wl-ticketing: the compliance report, a renox::grid (search, filters by
    reason and raised date, export with tickets.manage): the open compliance
    flags by subject, reason and age. Replace it with
    resources/views/wl-ticketing/compliance_flags.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['flags.title']">
  <rx-page-header :title="tx['flags.title']" :subtitle="tx['flags.subtitle']"/>
  <rx-grid :page="flags">
    <template rx-if="column.key == 'age'">{{ row.age }}</template>
    <template rx-elif="column.key == 'visit'"><a rx-if="row.visit_id" href="{{ route('wl_ticketing.show', row.visit_id) }}">{{ row.visit }}</a></template>
    <template rx-elif="column.key == 'contract'"><a rx-if="row.contract_id" href="{{ route('wl_ticketing.contract', row.contract_id) }}">{{ row.contract }}</a></template>
  </rx-grid>
</rx-page>
