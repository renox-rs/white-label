{#- wl-sales: the customer segments, a renox::grid that fills the screen: saved
    rules that pick parties for a retention campaign. The count is the last
    preview, an estimate. Replace it with resources/views/wl-sales/segments.html
    in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['segments.title']">
  <rx-page-header :title="tx['segments.title']" :subtitle="tx['segments.subtitle']" :back="route('wl_sales.campaigns')" :back-label="tx['campaigns.title']">
    <rx-link-button :href="route('wl_sales.segment_new')" :label="tx['segments.new_title']" icon="plus"/>
  </rx-page-header>
  <rx-grid :page="segments">
    <template rx-if="column.key == 'rules'">{{ row.rules }}</template>
  </rx-grid>
</rx-page>
