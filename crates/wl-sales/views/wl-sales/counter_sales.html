{#- wl-sales: the counter sales, a renox::grid that fills the screen. A cashier
    opens a cart for a walk-in or a named customer. Replace it with
    resources/views/wl-sales/counter_sales.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['counter.title']">
  <rx-page-header :title="tx['counter.title']" :subtitle="tx['counter.subtitle']">
    <rx-action-sheet id="open-counter-sale" :label="tx['counter.open']" :action="route('wl_sales.counter_sale_open')"
                     :title="tx['counter.open']" :description="tx['counter.open_description']" :submit-label="tx['counter.open']" variant="primary" icon="plus">
      <rx-input name="party_id" :label="tx['counter.customer']" id="open-counter-sale-party"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-grid :page="sales"/>
</rx-page>
