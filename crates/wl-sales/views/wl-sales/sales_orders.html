{#- wl-sales: the sales orders, a renox::grid that fills the screen (search on
    the number, customer and channel, filters by status, sum of the totals).
    Replace it with resources/views/wl-sales/sales_orders.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['orders.title']">
  <rx-page-header :title="tx['orders.title']" :subtitle="tx['orders.subtitle']">
    <rx-link-button :href="route('wl_sales.sales_orders')" :label="tx['orders.all'] if held_only else tx['orders.tab.active']" :variant="'plain' if awaiting or held_only else 'primary'"/>
    <rx-link-button :href="route('wl_sales.sales_orders') ~ '?awaiting=1'" :label="tx['orders.tab.awaiting'] ~ ' (' ~ awaiting_count ~ ')'" :variant="'primary' if awaiting else 'plain'"/>
    <rx-link-button :href="route('wl_sales.sales_orders') ~ '?view=credit_hold'" :label="tx['orders.on_credit_hold'] ~ ' (' ~ held_count ~ ')'" :variant="'primary' if held_only else 'plain'"/>
    <rx-action-sheet rx-if="can_create" id="create-sales-order" :label="tx['orders.create']" :action="route('wl_sales.sales_order_create')"
                     :title="tx['orders.create']" :submit-label="tx['orders.create']" variant="primary" icon="plus">
      <rx-input name="party_id" :label="tx['orders.customer']" id="create-sales-order-party" required/>
      <rx-input name="channel" :label="tx['orders.channel']" id="create-sales-order-channel"/>
      <rx-input name="payment_mode" :label="tx['orders.payment_mode']" id="create-sales-order-payment"/>
      <rx-input name="customer_po" :label="tx['po.customer_po']" id="create-sales-order-po"/>
      <rx-input name="call_off" :label="tx['po.call_off']" id="create-sales-order-call-off"/>
      <rx-input name="external_number" :label="tx['orders.external_number']" id="create-sales-order-external"/>
      <rx-input name="promo_code" :label="tx['orders.promo_code']" id="create-sales-order-promo"/>
      <rx-textarea name="delivery_address" :label="tx['delivery.address']" id="create-sales-order-delivery-address"/>
      <rx-input name="delivery_emirate" :label="tx['delivery.emirate']" id="create-sales-order-delivery-emirate"/>
      <rx-input name="delivery_country" :label="tx['delivery.country']" id="create-sales-order-delivery-country"/>
      <rx-select name="delivery_destination" :label="tx['delivery.destination']" :options="delivery_options" :selected="''" :placeholder="tx['delivery.not_stated']" id="create-sales-order-delivery-destination"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-grid :page="orders"/>
</rx-page>
