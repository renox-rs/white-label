{#- wl-sales: the sales orders. Replace it with
    resources/views/wl-sales/sales_orders.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['orders.title']">
  <rx-stack>
    <rx-page-header :title="tx['orders.title']" :subtitle="tx['orders.subtitle']">
      <rx-action-sheet rx-if="can_create" id="create-sales-order" :label="tx['orders.create']" :action="route('wl_sales.sales_order_create')"
                       :title="tx['orders.create']" :submit-label="tx['orders.create']" variant="primary" icon="plus">
        <rx-input name="party_id" :label="tx['orders.customer']" id="create-sales-order-party" required/>
        <rx-input name="channel" :label="tx['orders.channel']" id="create-sales-order-channel"/>
        <rx-input name="payment_mode" :label="tx['orders.payment_mode']" id="create-sales-order-payment"/>
        <rx-input name="customer_po" :label="tx['po.customer_po']" id="create-sales-order-po"/>
        <rx-input name="call_off" :label="tx['po.call_off']" id="create-sales-order-call-off"/>
      </rx-action-sheet>
    </rx-page-header>
    <rx-row>
      <rx-link-button rx-if="held_only" :href="route('wl_sales.sales_orders')" :label="tx['orders.all']"/>
      <rx-link-button rx-else :href="route('wl_sales.sales_orders') ~ '?view=credit_hold'" :label="tx['orders.on_credit_hold'] ~ ' (' ~ held_count ~ ')'"/>
    </rx-row>
    <rx-table :rows="orders" as="order" :key="order.id" :caption="tx['orders.title']" card>
      <rx-column :label="tx['orders.number']"><a href="{{ route('wl_sales.sales_order', order.id) }}">{{ order.number }}</a></rx-column>
      <rx-column :label="tx['orders.customer']" hide-narrow>{{ order.customer_name }}</rx-column>
      <rx-column :label="tx['orders.channel']" hide-narrow>{{ order.channel }}</rx-column>
      <rx-column :label="tx['orders.total']">{{ order.total }}</rx-column>
      <rx-column :label="tx['fields.status']"><rx-badge :kind="order.status_kind" :text="order.status_label"/></rx-column>
      <rx-column :label="tx['credit.hold_reason']" hide-narrow>{{ order.hold_reason }}</rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['orders.empty']" icon="inbox"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
