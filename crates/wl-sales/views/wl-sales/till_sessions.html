{#- wl-sales: the till sessions, a renox::grid that fills the screen. A cashier
    opens the drawer of a shift or a day with a float; the list shows what the
    till should hold and what was counted. Replace it with
    resources/views/wl-sales/till_sessions.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['till.title']">
  <rx-page-header :title="tx['till.title']" :subtitle="tx['till.subtitle']">
    <rx-action-sheet rx-if="can_open" id="open-till-session" :label="tx['till.open']" :action="route('wl_sales.till_session_open')"
                     :title="tx['till.open']" :description="tx['till.open_description']" :submit-label="tx['till.open']" variant="primary" icon="plus">
      <rx-input name="till" :label="tx['till.till']" id="open-till-session-till" required/>
      <rx-input name="location" :label="tx['till.location']" id="open-till-session-location"/>
      <rx-input name="float" :label="tx['till.float']" id="open-till-session-float"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-grid :page="sessions">
    <template rx-if="column.key == 'expected'">{{ row.expected }}</template>
  </rx-grid>
</rx-page>
