{#- wl-sales: the customer accounts, a renox::grid that fills the screen (search on
    the customer, filters by standing, limit and terms): what each customer may
    owe and owes now.
    Replace it with resources/views/wl-sales/credit_accounts.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['credit.title']">
  <rx-page-header :title="tx['credit.title']" :subtitle="tx['credit.subtitle']">
    <rx-action-sheet rx-if="can_edit" id="new-credit-account" :label="tx['credit.new']" :action="route('wl_sales.credit_account_save')"
                     :title="tx['credit.new']" :description="tx['credit.new_description']" :submit-label="tx['credit.save']" variant="primary" icon="plus">
      <rx-input name="party_id" :label="tx['orders.customer']" id="new-credit-account-party" required/>
      <rx-input name="credit_limit" :label="tx['credit.limit']" id="new-credit-account-limit"/>
      <rx-input name="payment_terms_days" :label="tx['credit.terms']" id="new-credit-account-terms"/>
      <rx-input name="grace_days" :label="tx['credit.grace']" id="new-credit-account-grace"/>
      <rx-input name="sales_rep" :label="tx['credit.sales_rep']" id="new-credit-account-rep"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-grid :page="accounts">
    <template rx-if="column.key == 'customer'"><a href="{{ row.url }}">{{ row.name }}</a></template>
    <template rx-elif="column.key == 'owes'">{{ row.owes }}</template>
  </rx-grid>
</rx-page>
