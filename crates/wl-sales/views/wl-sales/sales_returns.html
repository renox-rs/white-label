{#- wl-sales: the sales returns. Replace it with
    resources/views/wl-sales/sales_returns.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['returns.title']">
  <rx-stack>
    <rx-page-header :title="tx['returns.title']" :subtitle="tx['returns.subtitle']">
      <rx-action-sheet id="request-sales-return" :label="tx['returns.request']" :action="route('wl_sales.sales_return_request')"
                       :title="tx['returns.request']" :description="tx['returns.request_description']" :submit-label="tx['returns.request']" variant="primary" icon="plus">
        <rx-input name="sale_type" :label="tx['returns.sale_type']" id="request-return-sale-type" required/>
        <rx-input name="sale_id" :label="tx['returns.sale_id']" id="request-return-sale-id" required/>
        <rx-input name="kind" :label="tx['returns.kind']" id="request-return-kind"/>
        <rx-input name="lines" :label="tx['returns.lines']" id="request-return-lines" required/>
        <rx-textarea name="reason" :label="tx['returns.reason']" id="request-return-reason"/>
      </rx-action-sheet>
    </rx-page-header>
    <rx-table :rows="returns" as="item" :key="item.id" :caption="tx['returns.title']" card>
      <rx-column :label="tx['returns.number']"><a href="{{ route('wl_sales.sales_return', item.id) }}">{{ item.number }}</a></rx-column>
      <rx-column :label="tx['returns.sale']" hide-narrow>{{ item.sale }}</rx-column>
      <rx-column :label="tx['returns.value']">{{ item.value }}</rx-column>
      <rx-column :label="tx['fields.status']"><rx-badge :kind="item.status_kind" :text="item.status_label"/></rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['returns.empty']" icon="inbox"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
