{#- wl-sales: accounts that earned on more sales in a day than the limit
    (SAL.ACL.08), for the manager to review. Replace it with
    resources/views/wl-sales/loyalty_review.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['loyalty.review.title']">
  <rx-stack>
    <rx-page-header :title="tx['loyalty.review.title']" :subtitle="tx['loyalty.review.subtitle']" :back="route('wl_sales.loyalty')" :back-label="tx['loyalty.title']"/>
    <rx-table :rows="reviews" as="item" :key="item.id" :caption="tx['loyalty.review.title']" card>
      <rx-column :label="tx['loyalty.code']">{{ item.code }}</rx-column>
      <rx-column :label="tx['loyalty.party']" hide-narrow>{{ item.party }}</rx-column>
      <rx-column :label="tx['loyalty.review.day']">{{ item.on_date }}</rx-column>
      <rx-column :label="tx['loyalty.review.sales']">{{ item.sales_count }}</rx-column>
      <rx-row-actions>
        <rx-confirm :id="'resolve-review-' ~ item.id" :label="tx['loyalty.review.resolve']" :action="route('wl_sales.loyalty_review_resolve', item.id)" method="POST"
                    :title="tx['loyalty.review.resolve']" :message="item.code" :confirm-label="tx['loyalty.review.resolve']" :cancel-label="tx['cancel']" icon="check"/>
      </rx-row-actions>
      <rx-slot name="empty"><rx-empty :title="tx['loyalty.review.empty']" icon="inbox"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
