{#- wl-notify: the notification types, a renox::grid (search, filters by module,
    category, urgency and statutory) that fills the screen, with each one's
    statutory flag, give-up reaction (in run order) and staff role told.
    Replace it with resources/views/wl-notify/types.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['types.title']">
  <rx-page-header :title="tx['types.title']" :subtitle="tx['types.subtitle']"/>
  <rx-grid :page="types">
    <template rx-if="column.key == 'channels'">{{ row.channels }}</template>
    <template rx-elif="column.key == 'give_up'">{{ row.give_up }}</template>
    <template rx-elif="column.key == 'staff_role'">{{ row.staff_role }}</template>
    <template rx-elif="column.key == 'edit'"><a href="{{ row.edit_url }}">{{ tx['types.edit'] }}</a></template>
  </rx-grid>
</rx-page>
