name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The workspace has hundreds of integration-test binaries, each linking the
  # whole app; with debug info and symbols they filled the runner's disk
  # (linker "Bus error" at 0 MB free). Build them lean: no incremental data,
  # no debug info, no symbols.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_STRIP: symbols

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Remove large preinstalled toolchains this workspace does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /opt/az /usr/local/share/powershell /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # One package at a time, deleting the test binaries after each run:
      # all of them together no longer fit on the runner's disk (see the
      # script's header).
      - run: .github/ci-test.sh

  msrv:
    # Renox 1.2 needs Rust 1.94; so does this workspace (Cargo.toml).
    name: build on Rust 1.94
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
