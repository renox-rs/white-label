{#- logistics: the COD differences, a renox::grid of the shipments with one
    (search, sums of the money) that fills the screen. The totals by who
    absorbed them and the loss the business bears are badges in the header.
    Replace it with resources/views/logistics/cod_differences.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['cod_title']">
  <rx-page-header :title="tx['cod_title']" :subtitle="tx['cod_subtitle']">
    <template rx-for="total in totals">
      <rx-badge kind="info" :text="total.absorber ~ ' · ' ~ total.count ~ ' · ' ~ (total.total | money(currency='AED'))"/>
    </template>
    <rx-badge :kind="'warning' if losses else 'neutral'" :text="(losses | money(currency='AED')) ~ ' · ' ~ tx['cod_loss_total']"/>
  </rx-page-header>
  <rx-grid :page="rows"/>
</rx-page>
