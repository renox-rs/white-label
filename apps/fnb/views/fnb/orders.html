{#- fnb: the orders, a renox::grid (search on the number, customer and area,
    filters by status, channel and payment, sum of the totals) that fills the
    screen, newest first, with the reason a delivery failed or an order was
    cancelled. Replace it with resources/views/fnb/orders.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['title']">
  <rx-page-header :title="tx['title']" :subtitle="tx['subtitle']"/>
  <rx-grid :page="orders">
    <template rx-if="column.key == 'failure'">
      <span rx-if="row.failure" class="rx-subtitle">{{ row.failure }}</span>
    </template>
  </rx-grid>
</rx-page>
