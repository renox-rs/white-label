{#- manufacturing: the recalls, each linking to its customers. Replace it with
    resources/views/manufacturing/recalls.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['recalls.title']">
  <rx-stack>
    <rx-page-header :title="tx['recalls.title']" :subtitle="tx['recalls.subtitle']"/>
    <rx-table :rows="rows" as="recall" :key="recall.number" :caption="tx['recalls.title']" card>
      <rx-column :label="tx['recalls.recall']">
        <rx-stack>
          <span><a href="{{ recall.url }}">{{ recall.number }}</a></span>
          <span class="rx-subtitle">{{ recall.reason }}</span>
          <span><rx-badge :kind="recall.status_kind" :text="recall.status"/></span>
        </rx-stack>
      </rx-column>
      <rx-column :label="tx['recalls.opened']" hide-narrow>{{ recall.opened }}</rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['recalls.empty']" :message="tx['recalls.empty_text']" icon="triangle-alert"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
