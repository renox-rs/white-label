{#- manufacturing: the items that need a conformity certificate or are export
    only, a renox::grid that fills the screen (search on the item's code and
    name, filters on the flags), with the certificates on file. Replace it with
    resources/views/manufacturing/conformity.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['conformity.title']">
  <rx-page-header :title="tx['conformity.title']" :subtitle="tx['conformity.subtitle']">
    <rx-action-sheet rx-if="can_flag" id="flag-item" :label="tx['conformity.new']" :action="route('manufacturing.conformity_flag')"
                     :title="tx['conformity.new']" :description="tx['conformity.new_hint']" :submit-label="tx['conformity.new_save']" variant="primary" icon="plus">
      <rx-input name="code" type="text" :label="tx['conformity.code']" :hint="tx['conformity.code_hint']" id="flag-item-code" required/>
      <rx-checkbox name="regulated" value="1" :label="tx['conformity.regulated']" id="flag-item-regulated"/>
      <rx-checkbox name="export_only" value="1" :label="tx['conformity.export_only']" id="flag-item-export"/>
      <rx-checkbox name="customer_specific" value="1" :label="tx['conformity.customer_specific']" :hint="tx['conformity.customer_specific_hint']" id="flag-item-customer"/>
      <rx-checkbox rx-for="kind in kinds" name="kind" :value="kind[0]" :label="kind[1]" :id="'flag-item-kind-' ~ kind[0]"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-form-errors/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'item'">{{ row.item }}<span rx-if="row.accepted" class="rx-subtitle"> - {{ row.accepted }}</span></template>
    <template rx-elif="column.key == 'accepted'">{{ row.accepted }}</template>
    <template rx-elif="column.key == 'certificates'">
      <span rx-for="certificate in row.certificates">
        {{ certificate.kind }} {{ certificate.number }} - {{ certificate.valid_to }}
        <rx-badge :kind="certificate.validity_kind" :text="certificate.validity"/>
      </span>
    </template>
  </rx-grid>
</rx-page>
