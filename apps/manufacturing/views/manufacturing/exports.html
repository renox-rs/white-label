{#- manufacturing: the zero-rated export dispatches and the evidence of their
    exit (BL-MFG-12). Replace it with resources/views/manufacturing/exports.html
    in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['exports.title']">
  <rx-page-header :title="tx['exports.title']" :subtitle="tx['exports.subtitle']"/>
  <rx-form-errors/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'dispatch'">
      <a rx-if="row.dispatch_url" href="{{ row.dispatch_url }}">{{ row.number }}</a>
      <span rx-else>{{ row.number }}</span>
    </template>
    <template rx-elif="column.key == 'customer'">{{ row.customer }}</template>
    <template rx-elif="column.key == 'days'">{{ row.days }}</template>
    <template rx-elif="column.key == 'evidence'"><rx-link-button :href="row.evidence_url" :label="tx['exports.attach']"/></template>
    <template rx-elif="column.key == 'note'">{{ row.note }} <rx-open-button :id="'note-' ~ row.sheet" :label="tx['exports.note_edit']" size="small"/></template>
  </rx-grid>
  <template rx-for="sheet in sheets">
    <rx-action-sheet :id="'note-' ~ sheet.id" :label="tx['exports.note_edit']" :action="route('manufacturing.exports_note')"
                     :title="tx['exports.note_edit']" :description="tx['exports.note_hint']" :submit-label="tx['exports.note_save']" variant="secondary" icon="pencil" :button="false">
      <input type="hidden" name="party_id" :value="sheet.party_id"/>
      <rx-textarea name="note" :label="tx['exports.note']" :value="sheet.note" :id="'note-text-' ~ sheet.id"/>
    </rx-action-sheet>
  </template>
</rx-page>
