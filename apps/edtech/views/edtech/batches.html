{#- edtech: the batches, newest first, with their dates, weekly pattern,
    seats and status in words, and the action that plans one. Replace it with
    resources/views/edtech/batches.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['batches.title']">
  <rx-page-header :title="tx['batches.title']" :subtitle="tx['batches.subtitle']">
    <template rx-if="can_manage">
      <rx-action-sheet id="batch-new" :label="tx['batches.new']" :action="route('edtech.batch_create')"
                       :title="tx['batches.new']" :description="tx['batches.new_description']" :submit-label="tx['batches.new']" icon="plus">
        <rx-select name="course" :label="tx['batches.course']" :options="course_options" :selected="course_selected" id="batch-new-course"/>
        <rx-input name="capacity" type="number" :label="tx['batches.capacity']" id="batch-new-capacity" required/>
        <rx-input name="start_date" type="date" :label="tx['batches.start_date']" id="batch-new-start" required/>
        <rx-input name="end_date" type="date" :label="tx['batches.end_date']" id="batch-new-end" required/>
        <rx-input name="weekdays" :label="tx['batches.weekdays']" :hint="tx['batches.weekdays_hint']" id="batch-new-weekdays" required/>
        <rx-input name="start_time" :label="tx['batches.start_time']" :hint="tx['batches.start_time_hint']" id="batch-new-time" required/>
        <rx-input name="duration" type="number" :label="tx['batches.duration']" id="batch-new-duration" required/>
        <rx-select name="tutor" :label="tx['batches.tutor_pick']" :options="tutor_options" :selected="''" id="batch-new-tutor"/>
        <rx-select name="room" :label="tx['batches.room_pick']" :options="room_options" :selected="''" id="batch-new-room"/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="batches">
    <template rx-if="column.key == 'pattern'">{{ row.pattern }}</template>
    <template rx-elif="column.key == 'seats'">{{ row.seats }}</template>
  </rx-grid>
</rx-page>
