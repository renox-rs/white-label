{#- edtech: one certificate: who it is for, the course, its verification code
    and the actions of the coordinator and the company admin. Replace it with
    resources/views/edtech/certificate.html in the app. -#}
<rx-page layout="layouts/app.html" :title="title">
  <rx-stack>
    <rx-page-header :title="title" :subtitle="student" :badge="status" :badge-kind="status_kind" :back="route('edtech.enrolment', enrolment_id)" :back-label="enrolment">
      <template rx-if="can_issue">
        <rx-confirm :id="'certificate-issue-' ~ id" :label="tx['certificates.issue']" :action="route('edtech.certificate_issue', id)" method="POST"
                    :title="tx['certificates.issue']" :message="tx['certificates.issue_message']" :confirm-label="tx['certificates.issue']" :cancel-label="tx['button_cancel']" icon="check"/>
      </template>
      <template rx-if="can_copy">
        <rx-confirm :id="'certificate-copy-' ~ id" :label="tx['certificates.copy']" :action="route('edtech.certificate_copy', id)" method="POST"
                    :title="tx['certificates.copy']" :message="tx['certificates.copy_message']" :confirm-label="tx['certificates.copy']" :cancel-label="tx['button_cancel']" icon="printer"/>
      </template>
      <template rx-if="can_reissue">
        <rx-action-sheet :id="'certificate-reissue-' ~ id" :label="tx['certificates.reissue']" :action="route('edtech.certificate_reissue', id)"
                         :title="tx['certificates.reissue']" :description="tx['certificates.reissue_description']" :submit-label="tx['certificates.reissue']" icon="file-text">
          <rx-input name="reason" :label="tx['certificates.reissue_reason']" :id="'certificate-reissue-reason-' ~ id" required/>
          <rx-input name="student_name" :label="tx['certificates.corrected_name']" :value="student" :id="'certificate-reissue-name-' ~ id"/>
          <rx-input name="completion_date" type="date" :label="tx['certificates.corrected_date']" :value="completed_value" :id="'certificate-reissue-date-' ~ id"/>
          <template rx-if="has_attestation">
            <rx-checkbox name="copy_attestation" :label="tx['certificates.copy_attestation']" :id="'certificate-reissue-attestation-' ~ id"/>
          </template>
        </rx-action-sheet>
      </template>
      <template rx-if="can_revoke">
        <rx-action-sheet :id="'certificate-revoke-' ~ id" :label="tx['certificates.revoke']" :action="route('edtech.certificate_revoke', id)"
                         :title="tx['certificates.revoke']" :description="tx['certificates.revoke_description']" :submit-label="tx['certificates.revoke']" icon="trash">
          <rx-input name="reason" :label="tx['certificates.reason']" :id="'certificate-revoke-reason-' ~ id" required/>
        </rx-action-sheet>
      </template>
    </rx-page-header>
    <rx-card :title="tx['certificates.details']">
      <rx-infolist columns="2">
        <rx-entry :label="tx['certificates.student']" :value="student"/>
        <rx-entry :label="tx['certificates.course']" :value="course"/>
        <rx-entry :label="tx['certificates.approval']" :value="approval"/>
        <rx-entry :label="tx['certificates.completed']" :value="completed"/>
        <rx-entry :label="tx['certificates.issued']" :value="issued"/>
        <rx-entry :label="tx['certificates.code']" :value="code"/>
        <rx-entry :label="tx['certificates.verify_page']" :value="verify_path"/>
        <rx-entry :label="tx['certificates.replaces']" :value="replaces"/>
        <rx-entry :label="tx['certificates.replaced_by']" :value="replaced_by"/>
        <rx-entry :label="tx['certificates.revoke_reason']" :value="revoke_reason"/>
        <rx-entry :label="tx['certificates.reissue_reason_shown']" :value="reissue_reason"/>
        <rx-entry :label="tx['certificates.attestation']" :value="attestation"/>
        <rx-entry :label="tx['certificates.copies']" :value="copies"/>
      </rx-infolist>
    </rx-card>
    <div id="related-panel" hx-get="/related/edtech.certificate:{{ id }}/panel" hx-trigger="load" hx-swap="innerHTML"></div>
  </rx-stack>
</rx-page>
