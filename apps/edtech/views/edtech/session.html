{#- edtech: one session: when, who teaches, where, where it stands, and the
    actions of the tutor and the coordinator. Replace it with
    resources/views/edtech/session.html in the app. -#}
<rx-page layout="layouts/app.html" :title="title">
  <rx-stack>
    <rx-page-header :title="title" :subtitle="date" :badge="status" :badge-kind="status_kind" :back="route('edtech.batch', batch_id)" :back-label="batch">
      <template rx-if="can_attend">
        <rx-action-sheet :id="'session-attendance-' ~ id" :label="tx['sessions.attendance']" :action="route('edtech.session_attendance', id)"
                         :title="tx['sessions.attendance']" :description="tx['attendance.submit_description']" :submit-label="tx['sessions.attendance']" icon="check">
          <template rx-for="row in attend_rows">
            <rx-select :name="'mark_' ~ row.id" :label="row.label" :options="mark_options" :selected="row.selected" :id="'session-attendance-mark-' ~ row.id"/>
          </template>
        </rx-action-sheet>
      </template>
      <template rx-if="can_correct">
        <rx-action-sheet :id="'session-correction-' ~ id" :label="tx['corrections.action']" :action="route('edtech.session_correction', id)"
                         :title="tx['corrections.action']" :description="tx['corrections.description']" :submit-label="tx['corrections.action']" icon="check">
          <template rx-for="row in attend_rows">
            <rx-select :name="'mark_' ~ row.id" :label="row.label" :options="mark_options" :selected="row.selected" :id="'session-correction-mark-' ~ row.id"/>
          </template>
          <rx-input name="reason" :label="tx['corrections.reason']" :id="'session-correction-reason-' ~ id" required/>
        </rx-action-sheet>
      </template>
      <template rx-if="can_roster">
        <rx-action-sheet :id="'session-student-' ~ id" :label="tx['attendance.add']" :action="route('edtech.session_student', id)"
                         :title="tx['attendance.add']" :description="tx['attendance.add_description']" :submit-label="tx['attendance.add']" icon="plus">
          <rx-input name="enrolment" type="number" :label="tx['attendance.enrolment']" :id="'session-student-enrolment-' ~ id" required/>
        </rx-action-sheet>
        <rx-action-sheet :id="'session-notice-' ~ id" :label="tx['attendance.record_notice']" :action="route('edtech.session_notice', id)"
                         :title="tx['attendance.record_notice']" :description="tx['attendance.record_notice_description']" :submit-label="tx['attendance.record_notice']" icon="calendar">
          <rx-select name="enrolment" :label="tx['attendance.student']" :options="student_options" :id="'session-notice-student-' ~ id" required/>
          <rx-input name="given_at" :label="tx['attendance.given_at']" :id="'session-notice-given-' ~ id"/>
        </rx-action-sheet>
      </template>
      <template rx-if="can_excuse">
        <rx-action-sheet :id="'session-excuse-' ~ id" :label="tx['attendance.excuse']" :action="route('edtech.session_excuse', id)"
                         :title="tx['attendance.excuse']" :description="tx['attendance.excuse_description']" :submit-label="tx['attendance.excuse']" icon="check">
          <rx-select name="enrolment" :label="tx['attendance.student']" :options="student_options" :id="'session-excuse-student-' ~ id" required/>
          <rx-input name="reason" :label="tx['attendance.excuse_reason']" :id="'session-excuse-reason-' ~ id" required/>
        </rx-action-sheet>
      </template>
      <template rx-if="can_close_flag">
        <rx-action-sheet :id="'session-flag-' ~ id" :label="tx['sessions.close_flag']" :action="route('edtech.session_flag', id)"
                         :title="tx['sessions.close_flag']" :description="tx['sessions.close_flag_description']" :submit-label="tx['sessions.close_flag']" icon="check">
          <rx-select name="flag" :label="tx['sessions.doc_flag']" :options="flag_options" :id="'session-flag-select-' ~ id" required/>
          <rx-input name="note" :label="tx['sessions.flag_note']" :id="'session-flag-note-' ~ id" required/>
        </rx-action-sheet>
      </template>
      <template rx-if="can_change">
        <rx-action-sheet :id="'session-reschedule-' ~ id" :label="tx['sessions.reschedule']" :action="route('edtech.session_reschedule', id)"
                         :title="tx['sessions.reschedule']" :description="tx['sessions.reschedule_description']" :submit-label="tx['sessions.reschedule']" icon="calendar">
          <rx-input name="date" type="date" :label="tx['sessions.new_date']" :value="date" :id="'session-reschedule-date-' ~ id" required/>
          <rx-input name="start_time" :label="tx['sessions.new_time']" :value="start_time" :id="'session-reschedule-time-' ~ id" required/>
        </rx-action-sheet>
        <rx-action-sheet :id="'session-tutor-' ~ id" :label="tx['sessions.change_tutor']" :action="route('edtech.session_tutor', id)"
                         :title="tx['sessions.change_tutor']" :description="tx['sessions.change_tutor_description']" :submit-label="tx['sessions.change_tutor']" icon="user">
          <rx-input name="tutor" type="number" :label="tx['batches.tutor_resource']" :id="'session-tutor-resource-' ~ id" required/>
          <rx-input name="employee" type="number" :label="tx['batches.tutor_employee']" :id="'session-tutor-employee-' ~ id"/>
        </rx-action-sheet>
        <rx-action-sheet :id="'session-cancel-' ~ id" :label="tx['sessions.cancel']" :action="route('edtech.session_cancel', id)"
                         :title="tx['sessions.cancel']" :description="tx['sessions.cancel_description']" :submit-label="tx['sessions.cancel']" icon="trash">
          <rx-input name="reason" :label="tx['sessions.reason']" :id="'session-cancel-reason-' ~ id" required/>
          <rx-input name="make_up_on" type="date" :label="tx['sessions.make_up_on']" :id="'session-cancel-make-up-' ~ id"/>
        </rx-action-sheet>
      </template>
    </rx-page-header>
    <rx-alert rx-if="flagged" kind="warning" :message="flag ~ ': ' ~ flag_reason"/>
    <rx-card :title="tx['sessions.details']">
      <rx-infolist columns="2">
        <rx-entry :label="tx['sessions.batch']" :value="batch"/>
        <rx-entry :label="tx['sessions.date']" :value="date"/>
        <rx-entry :label="tx['sessions.time']" :value="time"/>
        <rx-entry :label="tx['sessions.tutor']" :value="tutor"/>
        <rx-entry :label="tx['sessions.room']" :value="room"/>
        <rx-entry :label="tx['sessions.cancel_reason']" :value="cancel_reason"/>
      </rx-infolist>
    </rx-card>
    <template rx-if="show_students">
      <rx-table :rows="students" as="row" :key="row.enrolment" :caption="tx['attendance.title']" card>
        <rx-column :label="tx['attendance.student']">{{ row.student }}</rx-column>
        <rx-column :label="tx['attendance.enrolment']" hide-narrow>{{ row.enrolment }}</rx-column>
        <rx-column :label="tx['attendance.mark']"><rx-badge :kind="row.mark_kind" :text="row.mark"/></rx-column>
        <rx-column :label="tx['attendance.notice']" hide-narrow>{{ row.notice }}</rx-column>
        <rx-column :label="tx['attendance.credit']" hide-narrow>{{ row.credit }}</rx-column>
      </rx-table>
    </template>
    <template rx-if="show_doc_flags">
      <rx-table :rows="doc_flags" as="row" :key="row.id" :caption="tx['sessions.doc_flags']" card>
        <rx-column :label="tx['sessions.doc_flag']">{{ row.label }}</rx-column>
        <rx-column :label="tx['sessions.date']">{{ row.on_date }}</rx-column>
        <rx-column :label="tx['fields.status']"><rx-badge :kind="row.status_kind" :text="row.status"/></rx-column>
        <rx-column :label="tx['sessions.flag_reviewed_by']" hide-narrow>{{ row.reviewed_by }}</rx-column>
        <rx-column :label="tx['sessions.flag_note']" hide-narrow>{{ row.note }}</rx-column>
      </rx-table>
    </template>
  </rx-stack>
</rx-page>
