{#- edtech: the sessions from today, soonest first, with the tutor, the room
    and where each stands. Replace it with
    resources/views/edtech/sessions.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['sessions.title']">
  <rx-stack>
    <rx-page-header :title="tx['sessions.title']" :subtitle="tx['sessions.subtitle']"/>
    <rx-table :rows="sessions" as="row" :key="row.id" :caption="tx['sessions.title']" card>
      <rx-column :label="tx['sessions.date']"><a href="{{ route('edtech.session', row.id) }}">{{ row.date }}</a></rx-column>
      <rx-column :label="tx['sessions.time']">{{ row.time }}</rx-column>
      <rx-column :label="tx['sessions.batch']">{{ row.batch }}</rx-column>
      <rx-column :label="tx['sessions.tutor']" hide-narrow>{{ row.tutor }}</rx-column>
      <rx-column :label="tx['sessions.room']" hide-narrow>{{ row.room }}</rx-column>
      <rx-column :label="tx['fields.status']"><rx-badge :kind="row.status_kind" :text="row.status"/></rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['sessions.empty']" icon="calendar-days"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
