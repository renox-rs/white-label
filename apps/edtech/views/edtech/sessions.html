{#- edtech: the sessions from today, soonest first, a renox::grid (filters by
    day range, batch, tutor, room and status) that fills the screen. Replace
    it with resources/views/edtech/sessions.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['sessions.title']">
  <rx-page-header :title="tx['sessions.title']" :subtitle="tx['sessions.subtitle']"/>
  <rx-grid :page="sessions">
    <template rx-if="column.key == 'time'">{{ row.time }}</template>
    <template rx-elif="column.key == 'flag'">{{ row.flag }}</template>
  </rx-grid>
</rx-page>
