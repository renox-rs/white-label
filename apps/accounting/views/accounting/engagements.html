{#- accounting: the engagements, a renox::grid (search on the number, client
    and services, filters by status and reason) that fills the screen, and the
    action that creates one. Replace it with
    resources/views/accounting/engagements.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['engagements.title']">
  <rx-page-header :title="tx['engagements.title']" :subtitle="tx['engagements.subtitle']">
    <template rx-if="can_create">
      <rx-action-sheet id="engagement-new" :label="tx['engagements.new']" :action="route('accounting.engagement_create')"
                       :title="tx['engagements.new']" :description="tx['engagements.new_description']" :submit-label="tx['engagements.new']" icon="plus">
        <rx-select name="client" :label="tx['engagements.client_party']" :options="[]" :placeholder="tx['pickers.search']" options-url="{{ route('accounting.party_options') }}" id="engagement-new-client" required/>
        <rx-input name="title" :label="tx['engagements.services']" id="engagement-new-services" required/>
        <rx-select name="fee_basis" :label="tx['engagements.fee_basis']" :options="fee_bases" :selected="'retainer'" id="engagement-new-basis"/>
        <rx-input name="retainer_fee" :label="tx['engagements.retainer_fee']" id="engagement-new-fee"/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="engagements"/>
</rx-page>
