{#- accounting: the returns, a renox::grid (search on the number and client,
    filters by tax, status and dates) that fills the screen, and the action
    that opens one. Replace it with resources/views/accounting/returns.html in
    the app. -#}
<rx-page layout="layouts/app.html" :title="tx['returns.title']">
  <rx-page-header :title="tx['returns.title']" :subtitle="tx['returns.subtitle']">
    <template rx-if="can_create">
      <rx-action-sheet id="return-new" :label="tx['returns.new']" :action="route('accounting.return_create')"
                       :title="tx['returns.new']" :description="tx['returns.new_description']" :submit-label="tx['returns.new']" icon="plus">
        <rx-select name="engagement" :label="tx['returns.engagement_number']" :options="[]" :placeholder="tx['pickers.search']" options-url="{{ route('accounting.engagement_options') }}" id="return-new-engagement" required/>
        <rx-select name="return_type" :label="tx['returns.kind']" :options="types" :selected="'vat'" id="return-new-type"/>
        <rx-input name="period_end" type="date" :label="tx['returns.period']" id="return-new-period" required/>
        <rx-input name="due_date" type="date" :label="tx['returns.due']" id="return-new-due" required/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="returns"/>
</rx-page>
