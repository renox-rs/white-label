{#- accounting: the KPI packs, a renox::grid (search on the number and client,
    filters by status) that fills the screen, and the action that imports a
    trial balance (a new draft, or the open draft recalculated). Replace it
    with resources/views/accounting/kpi_packs.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['kpi.title']">
  <rx-page-header :title="tx['kpi.title']" :subtitle="tx['kpi.subtitle']">
    <template rx-if="can_import">
      <rx-action-sheet id="kpi-import" :label="tx['kpi.import']" :action="route('accounting.kpi_import')"
                       :title="tx['kpi.import']" :description="tx['kpi.import_description']" :submit-label="tx['kpi.import']" icon="upload">
        <rx-input name="client" :label="tx['kpi.client_party']" id="kpi-import-client" required/>
        <rx-input name="period" :label="tx['kpi.period_field']" id="kpi-import-period" required/>
        <rx-textarea name="csv" :label="tx['kpi.csv']" id="kpi-import-csv" required/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="packs"/>
</rx-page>
