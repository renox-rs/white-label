{#- manpower: the absence cases of workers who have not turned up, open and
    closed, for HR (`absence.manage`), a renox::grid (search on the report
    number, filters by status and dates, export) that fills the screen. Replace
    it with resources/views/manpower/absence_cases.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['absence.title']">
  <rx-page-header :title="tx['absence.title']" :subtitle="tx['absence.subtitle']"/>
  <rx-grid :page="cases">
    <template rx-if="column.key == 'worker'"><a href="{{ row.url }}">{{ row.worker }}</a></template>
    <template rx-elif="column.key == 'client'">{{ row.client }}</template>
    <template rx-elif="column.key == 'days'">{{ row.days }}</template>
    <template rx-elif="column.key == 'contacts'">{{ row.contacts }}</template>
    <template rx-elif="column.key == 'report'">{{ row.report }}</template>
  </rx-grid>
</rx-page>
