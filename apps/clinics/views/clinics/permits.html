{#- clinics: the advertising permits of the campaigns that promote services
    (CLN.ACL.13), a renox::grid that fills the screen: the permit number, its
    last valid day and who approved it. The medical director records them.
    Replace it with resources/views/clinics/permits.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['permit.title']">
  <rx-page-header :title="tx['permit.title']" :subtitle="tx['permit.subtitle']">
    <template rx-if="can_manage">
      <rx-action-sheet id="permit-record" :label="tx['permit.record']" :action="route('clinics.campaign_permit_record')"
                       :title="tx['permit.record']" :description="tx['permit.record_description']" :submit-label="tx['permit.record']" icon="shield-check">
        <rx-input name="campaign" type="number" :label="tx['permit.campaign']" id="permit-campaign" required/>
        <rx-select name="promotes" :label="tx['permit.promotes']" :options="promotes_options" :selected="'yes'" id="permit-promotes"/>
        <rx-input name="permit_number" :label="tx['permit.number']" id="permit-number"/>
        <rx-input name="valid_to" type="date" :label="tx['permit.valid_to']" id="permit-valid-to"/>
      </rx-action-sheet>
    </template>
  </rx-page-header>
  <rx-grid :page="permits">
    <template rx-if="column.key == 'campaign'">{{ row.campaign }}</template>
  </rx-grid>
</rx-page>
