{#- clinics: the appointments from today on, a renox::grid (filters by start
    and service) that fills the screen, soonest first, with where the cover of
    each insured visit stands; each opens the pre-check-in screen. Replace it
    with resources/views/clinics/appointments.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['appointments.list_title']">
  <rx-page-header :title="tx['appointments.list_title']" :subtitle="tx['appointments.list_subtitle']"/>
  <rx-grid :page="appointments">
    <template rx-if="column.key == 'patient'">{{ row.patient }}</template>
    <template rx-elif="column.key == 'cover'"><rx-badge :kind="row.cover_kind" :text="row.cover"/></template>
    <template rx-elif="column.key == 'flags'">{{ row.flags }}</template>
    <template rx-elif="column.key == 'open'"><a href="{{ row.url }}">{{ tx['appointments.title'] }}</a></template>
  </rx-grid>
</rx-page>
