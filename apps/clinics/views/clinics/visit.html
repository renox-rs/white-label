{#- clinics: a visit: its status, the cover the check-in recorded (the
    eligibility result, the outcome, the policy of the split, the self-pay
    consent) and its history. Replace it with
    resources/views/clinics/visit.html in the app. -#}
<rx-page layout="layouts/app.html" :title="number">
  <rx-stack>
    <rx-page-header :title="number" :subtitle="patient" :badge="status" :badge-kind="status_kind">
      <template rx-if="can_insure">
        <rx-action-sheet :id="'visit-insured-' ~ id" :label="tx['coverage.change_to_insured']" :action="route('clinics.visit_insured', id)"
                         :title="tx['coverage.change_to_insured']" :description="tx['coverage.change_to_insured_description']" :submit-label="tx['coverage.change_to_insured']" icon="shield-check">
          <rx-input name="reference" :label="tx['coverage.reference']" :id="'visit-insured-reference-' ~ id"/>
        </rx-action-sheet>
      </template>
    </rx-page-header>
    <rx-card :title="tx['visits.details']">
      <rx-infolist columns="2">
        <rx-entry :label="tx['appointments.patient']" :value="patient"/>
        <rx-entry :label="tx['appointments.service']" :value="service"/>
        <rx-entry :label="tx['appointments.visit_date']" :value="visit_date"/>
        <rx-entry :label="tx['coverage.policy']" :value="policy"/>
        <rx-entry :label="tx['coverage.outcome']" :value="outcome"/>
        <rx-entry :label="tx['coverage.split_policy']" :value="split_policy"/>
        <rx-entry :label="tx['consent.title']" :value="consent"/>
        <rx-entry :label="tx['consent.estimate']" :value="estimate"/>
      </rx-infolist>
    </rx-card>
    <rx-table :rows="history" as="row" :key="row.at ~ row.action" :caption="tx['visits.history']" card>
      <rx-column :label="tx['visits.history_at']">{{ row.at }}</rx-column>
      <rx-column :label="tx['visits.history_action']">{{ row.action }}</rx-column>
      <rx-column :label="tx['visits.history_by']" hide-narrow>{{ row.by }}</rx-column>
      <rx-slot name="empty"><rx-empty :title="tx['visits.history_empty']" icon="history"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
