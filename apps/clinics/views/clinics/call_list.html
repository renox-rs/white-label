{#- clinics: the appointments of the next 24 hours, per branch, to phone while
    the SMS or WhatsApp connection is down, a renox::grid that fills the screen,
    each with a called tick (a confirm after the grid). Replace it with
    resources/views/clinics/call_list.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['call_list.title']">
  <rx-page-header :title="tx['call_list.title']" :subtitle="tx['call_list.subtitle']">
    <rx-badge rx-if="down" kind="warning" :text="tx['call_list.since'] ~ ' ' ~ since"/>
  </rx-page-header>
  <rx-include template="wl-kernel/integration_banner.html"/>
  <rx-grid :page="rows">
    <template rx-if="column.key == 'branch'">{{ row.branch }}</template>
    <template rx-elif="column.key == 'patient'">{{ row.patient }}</template>
    <template rx-elif="column.key == 'phone'">{{ row.phone }}</template>
    <template rx-elif="column.key == 'called'">{{ row.called_text }}</template>
    <template rx-elif="column.key == 'tick'">
      <rx-open-button rx-if="not row.called" :id="'call-tick-' ~ row.booking" :label="tx['call_list.tick']" icon="phone" size="small"/>
    </template>
  </rx-grid>
  <rx-confirm rx-for="booking in to_call" :button="false" :id="'call-tick-' ~ booking" :label="tx['call_list.tick']" :action="route('clinics.call_list_tick', booking)" method="POST"
              :title="tx['call_list.tick']" :message="tx['call_list.tick_message']" :confirm-label="tx['call_list.tick']" :cancel-label="tx['button_cancel']" icon="phone"/>
</rx-page>
