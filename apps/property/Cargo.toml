[package]
name = "property"
description = "Property: the vertical app for property management companies (portfolio, leases, lease to cash)."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
renox.workspace = true
serde.workspace = true
wl-kernel = { path = "../../crates/wl-kernel" }

[dev-dependencies]
tempfile = "3"
# The real money modules in the integration tests (lease to cash with no fake
# invoicer, payment recorder or deposit book), and the real documents module
# for the tenant acceptance.
wl-documents = { path = "../../crates/wl-documents" }
wl-invoicing = { path = "../../crates/wl-invoicing" }
wl-payments = { path = "../../crates/wl-payments" }
