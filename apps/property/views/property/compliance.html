{#- property: the open compliance flags of the buildings, a renox::grid with
    the cause and since when; the number of buildings is a badge in the header.
    Replace it with resources/views/property/compliance.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['compliance.title']">
  <rx-page-header :title="tx['compliance.title']" :subtitle="tx['compliance.subtitle']" :back="route('property.index')" :back-label="tx['portfolio.title']">
    <rx-badge :kind="'warning' if count else 'neutral'" :text="count ~ ' · ' ~ tx['compliance.count']"/>
  </rx-page-header>
  <rx-grid :page="flags"/>
</rx-page>
