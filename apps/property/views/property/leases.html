{#- property: the leases, newest first, a renox::grid (search on the number,
    unit and Ejari number, filters by status, sum of the annual rent) that fills the
    screen. A lease is drafted on an available unit (the building page).
    Replace it with resources/views/property/leases.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['leases.title']">
  <rx-page-header :title="tx['leases.title']" :subtitle="tx['leases.subtitle']" :back="route('property.index')" :back-label="tx['portfolio.title']"/>
  <rx-grid :page="leases">
    <template rx-if="column.key == 'tenant'">{{ row.tenant }}</template>
  </rx-grid>
</rx-page>
