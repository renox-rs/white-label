{#- property: the page at /property. Replace it with
    resources/views/property/index.html in your app. -#}
<rx-page layout="layouts/app.html" :title="heading">
  <rx-stack>
    <rx-page-header :title="heading"/>
    <rx-table :rows="entries" as="entry" :key="entry.id" :caption="heading">
      <rx-column label="Title">{{ entry.title }}</rx-column>
      <rx-slot name="empty"><rx-empty :title="empty"/></rx-slot>
    </rx-table>
  </rx-stack>
</rx-page>
