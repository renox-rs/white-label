{#- property: the portfolio: the buildings with their units and occupancy (a
    renox::grid that fills the screen), and the form that adds a building. Replace it with
    resources/views/property/index.html in the app. -#}
<rx-page layout="layouts/app.html" :title="tx['portfolio.title']">
  <rx-page-header :title="tx['portfolio.title']" :subtitle="tx['portfolio.subtitle']">
    <template rx-if="can_manage">
      <rx-action-sheet id="add-building" :label="tx['buildings.add']" :action="route('property.building_create')"
                       :title="tx['buildings.add']" :submit-label="tx['buildings.add']" variant="primary" icon="plus">
        <rx-input name="code" :label="tx['buildings.code']" id="add-building-code" required/>
        <rx-input name="name_en" :label="tx['buildings.name_en']" id="add-building-name-en" required/>
        <rx-input name="name_ar" :label="tx['buildings.name_ar']" id="add-building-name-ar"/>
        <rx-select name="emirate" :label="tx['buildings.emirate']" :options="emirates" :selected="'dubai'" id="add-building-emirate"/>
        <rx-input name="community" :label="tx['buildings.community']" id="add-building-community"/>
        <rx-input name="plot_number" :label="tx['buildings.plot_number']" id="add-building-plot"/>
        <rx-input name="premise_number" :label="tx['buildings.premise_number']" id="add-building-premise"/>
      </rx-action-sheet>
    </template>
    <template rx-if="can_see_compliance">
      <rx-link-button :href="route('property.compliance')" :label="tx['compliance.title'] ~ ' (' ~ non_compliant ~ ')'" variant="secondary" icon="shield-alert"/>
    </template>
    <rx-link-button :href="route('property.leases')" :label="tx['leases.title']" variant="secondary" icon="file-text"/>
  </rx-page-header>
  <rx-grid :page="buildings"/>
</rx-page>
