{#- property: the owner statements, newest period first, a renox::grid (search
    on the number, filter by status, sum of the balances) that fills
    the screen. Replace it with resources/views/property/statements.html in the
    app. -#}
<rx-page layout="layouts/app.html" :title="tx['statements.title']">
  <rx-page-header :title="tx['statements.title']" :subtitle="tx['statements.subtitle']" :back="route('property.index')" :back-label="tx['portfolio.title']"/>
  <rx-grid :page="statements">
    <template rx-if="column.key == 'owner'">{{ row.owner }}</template>
  </rx-grid>
</rx-page>
