<rx-page layout="layouts/app.html" title="{{ t('settings.compliance.title') }}">
  <rx-page-header title="{{ t('settings.compliance.title') }}" subtitle="{{ t('settings.compliance.subtitle') }}"/>
  {#- Search and group filter: the rows come from code, so the handler narrows them (?q=, ?group=). -#}
  <form method="get">
    <rx-toolbar>
      <rx-input name="q" type="search" label="{{ t('settings.search') }}" :value="q" id="settings-q"/>
      <rx-select name="group" label="{{ t('settings.group_filter') }}" :options="groups" :placeholder="t('settings.all_groups')" :selected="group" id="settings-group"/>
      <rx-button type="submit" label="{{ t('settings.show') }}" icon="search"/>
    </rx-toolbar>
  </form>
  <section class="rx-pane rx-fill">
    <rx-table rx-if="rows" :rows="rows" as="row" :key="row.number" caption="{{ t('settings.compliance.title') }}">
        <rx-column label="{{ t('settings.compliance.number') }}">{{ row.number }}</rx-column>
        <rx-column label="{{ t('settings.compliance.group') }}" hide-narrow>{{ row.group }}</rx-column>
        <rx-column label="{{ t('settings.compliance.setting') }}">{{ row.setting }}</rx-column>
        <rx-column label="{{ t('settings.compliance.value') }}">{{ row.value }}</rx-column>
        <rx-column label="{{ t('settings.compliance.source') }}" hide-narrow>{{ row.source }}</rx-column>
        <rx-column label="{{ t('settings.compliance.reference') }}" hide-narrow>{{ row.reference }}</rx-column>
        <rx-column label="{{ t('settings.compliance.open') }}" hide-narrow>{{ row.open }}</rx-column>
    </rx-table>
    <rx-empty rx-else :title="t('settings.none')" :message="t('settings.none_text')" icon="search"/>
  </section>
</rx-page>
