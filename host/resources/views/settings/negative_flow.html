<rx-page layout="layouts/app.html" title="{{ t('settings.negative_flow.title') }}">
  <rx-stack>
    <app-page-title icon="sliders-horizontal" title="{{ t('settings.negative_flow.title') }}" subtitle="{{ t('settings.negative_flow.subtitle') }}"/>
    <rx-table :rows="rows" as="row" :key="row.number" caption="{{ t('settings.negative_flow.title') }}" card>
      <rx-column label="{{ t('settings.negative_flow.number') }}">{{ row.number }}</rx-column>
      <rx-column label="{{ t('settings.negative_flow.group') }}" hide-narrow>{{ row.group }}</rx-column>
      <rx-column label="{{ t('settings.negative_flow.setting') }}">{{ row.setting }}</rx-column>
      <rx-column label="{{ t('settings.negative_flow.value') }}">{{ row.value }}</rx-column>
      <rx-column label="{{ t('settings.negative_flow.source') }}" hide-narrow>{{ row.source }}</rx-column>
    </rx-table>
  </rx-stack>
</rx-page>
