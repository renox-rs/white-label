<rx-page layout="layouts/app.html" title="{{ t('users.title') }}">
  {#- The figures are badges and "Add a user" a button in the header, so the grid keeps the height. -#}
  <rx-page-header title="{{ t('users.title') }}" subtitle="{{ t('users.subtitle') }}">
    <rx-badge :text="(totals.people | number) ~ ' · ' ~ t('users.figures.people')"/>
    <rx-badge kind="info" :text="(totals.admins | number) ~ ' · ' ~ t('users.figures.admins')"/>
    <rx-badge kind="success" :text="(totals.verified | number) ~ ' · ' ~ t('users.figures.verified')"/>
    <rx-action-sheet id="add-user" label="{{ t('users.add') }}" action="{{ route('users.invite') }}" title="{{ t('users.add') }}" description="{{ t('users.add_description') }}" submit-label="{{ t('users.add_submit') }}" icon="user-plus">
      <rx-input name="name" label="{{ t('users.name') }}" id="add-user-name" required/>
      <rx-input name="email" type="email" label="{{ t('users.email') }}" id="add-user-email" required/>
      <rx-checkbox-list name="roles" label="{{ t('users.roles') }}" :options="role_names" :selected="[]" id="add-user-roles"/>
    </rx-action-sheet>
  </rx-page-header>
  <rx-grid :page="users">
    <template rx-if="column.key == 'roles'">
      <template rx-for="role in row.roles"><rx-badge :kind="'info' if role == 'admin' else none">{{ role }}</rx-badge> </template>
      <span rx-if="not row.roles" class="rx-subtitle">{{ t('users.no_role') }}</span>
    </template>
    <rx-open-button rx-elif="column.key == 'actions'" id="roles-{{ row.id }}" label="{{ t('users.roles') }}" size="small"/>
  </rx-grid>
  {#- A sheet per person to change their roles: a form sent with htmx; errors
      stay in the sheet, a success refreshes the page. -#}
  <rx-action-sheet rx-for="member in members" :button="false" id="roles-{{ member.id }}" label="{{ t('users.roles') }}" action="{{ route('users.roles', member.id) }}" method="PUT" title="{{ t('users.roles_of', name=member.name) }}" submit-label="{{ t('users.save') }}">
    <rx-checkbox-list name="roles" label="{{ t('users.roles') }}" :options="role_names" :selected="member.roles" id="roles-{{ member.id }}-list" hint="{{ t('users.roles_hint') }}"/>
  </rx-action-sheet>
</rx-page>
